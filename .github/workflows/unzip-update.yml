# Unpacks an uploaded update zip into the repository and commits the files inside it.
#
# One-time setup (GitHub web interface):
#   Add file → Create new file → type the name  .github/workflows/unzip-update.yml
#   (the slashes create the folders) → paste this file → Commit changes.
#
# Each update after that:
#   Add file → Upload files → drop in the .zip → Commit changes.
#   This workflow then replaces the files with the ones in the zip, deletes the zip,
#   and asks GitHub Pages to rebuild the site. Progress shows under the Actions tab.
name: Unpack uploaded update

on:
  push:
    branches: [main]
    paths: ['*.zip']

permissions:
  contents: write
  pages: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip into the repository root and remove the zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -d .
            git rm -q "$z"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack uploaded update"
          git push

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null && echo "Pages rebuild requested"
